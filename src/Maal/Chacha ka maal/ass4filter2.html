<!--Using angular js display the student details who are live in pune in Table format (using ngrepeat directive, use Array to store data, use filter).-->
<!DOCTYPE html>
<html ng-app="myApp">
<head>
  <title>Student Details - Pune</title>
  <script src="angular.min.js"></script>
  <style>
    table {
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid black;
      padding: 5px;
    }
  </style>
</head>
<body ng-controller="StudentController">

  <h1>Student Details - Pune</h1>

  <table>
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Age</th>
      <th>City</th>
    </tr>
    <tr ng-repeat="student in students | filter:{ city: 'Pune' }">
      <td>{{ $index + 1 }}</td>
      <td>{{ student.name }}</td>
      <td>{{ student.age }}</td>
      <td>{{ student.city }}</td>
    </tr>
  </table>

  <script>
    angular.module('myApp', [])
      .controller('StudentController', function($scope) {
        $scope.students = [
          { name: 'John Doe', age: 18, city: 'Pune' },
          { name: 'Jane Smith', age: 17, city: 'Mumbai' },
          { name: 'Mike Johnson', age: 19, city: 'Pune' },
          { name: 'Emily Davis', age: 18, city: 'Delhi' },
          { name: 'David Anderson', age: 17, city: 'Pune' },
          { name: 'Sarah Wilson', age: 19, city: 'Mumbai' },
          { name: 'Michael Brown', age: 18, city: 'Pune' },
          { name: 'Jessica Taylor', age: 17, city: 'Bangalore' },
          { name: 'Daniel Miller', age: 19, city: 'Pune' },
          { name: 'Amy Moore', age: 18, city: 'Mumbai' }
        ];
      });
  </script>

</body>
</html>
