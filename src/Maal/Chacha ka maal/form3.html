<!--Write an angularjs program to create a simple form using AngularJS's form directives and handling form submission.-->

<!DOCTYPE html>
<html ng-app="formApp">
<head>
    <title>AngularJS Form Example</title>
    <script src="angular.min.js"></script>
   
</head>
<body>
    <div ng-controller="FormController">
        <h2>Contact Us</h2>
        
        <form name="contactForm" ng-submit="submitForm()">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" ng-model="name" required>
           
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" ng-model="email" required>
           
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" ng-model="message" required></textarea>
           
            
            <button type="submit">Submit</button>
        </form>
        
        <div ng-show="formSubmitted">
         
            <h3>Your Information </h3>
            <p>Name: {{ name }}</p>
            <p>Email: {{ email }}</p>
            <p>Message: {{ message }}</p>
        </div>
    </div>
</body>
</html>

<script>

var app = angular.module('formApp', []);

app.controller('FormController', function($scope) {
    
    $scope.formSubmitted = false;

    $scope.submitForm = function() {
        if ($scope.contactForm.$valid) {
            $scope.formSubmitted = true;
        }
    };
});
</script>
